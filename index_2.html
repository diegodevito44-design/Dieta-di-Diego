<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dieta di Diego</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1819" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app a una colonna per iPhone X. Barra del giorno fissa in alto, schede dei pasti al centro, tre schede in basso.
   Le quantità stanno in una colonna a parte, in monospazio, come la posologia su una ricetta. */
:root{
  --bg:#EEF3F1;
  --surface:#FFFFFF;
  --surface-2:#E5EDEA;
  --fg:#10252A;
  --muted:#586E73;
  --line:#D3DEDB;
  --accent:#0C6A60;
  --accent-fg:#FFFFFF;
  --accent-soft:#D4EDE8;
  --font-display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-body:"Figtree","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1819;
    --surface:#132427;
    --surface-2:#1B3134;
    --fg:#E3EEEC;
    --muted:#8FA7AB;
    --line:#25393C;
    --accent:#5CCDBE;
    --accent-fg:#06211E;
    --accent-soft:#17403E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1819;
  --surface:#132427;
  --surface-2:#1B3134;
  --fg:#E3EEEC;
  --muted:#8FA7AB;
  --line:#25393C;
  --accent:#5CCDBE;
  --accent-fg:#06211E;
  --accent-soft:#17403E;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:0 104px;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{
  max-width:560px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra superiore */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.eyebrow{margin:0;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 30px/1.1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h1 .d{display:block;font:500 14px var(--font-body);letter-spacing:0;color:var(--muted);margin-top:2px}
.chip{flex:none;font:500 12px var(--font-mono);padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:4px}
.chip.full{background:var(--accent);color:var(--accent-fg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding-block:12px}
.day{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-height:56px;padding:4px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);
}
.day .l{font:500 11px var(--font-mono);text-transform:uppercase;color:var(--muted)}
.day .n{font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.day::after{content:"";width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.day.today::after{background:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day[aria-pressed="true"] .l{color:inherit;opacity:.85}
.day[aria-pressed="true"].today::after{background:var(--accent-fg)}

main{padding-block:4px 0}

/* scheda pasto */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.meal.done .meal-h{background:var(--accent-soft)}
.meal-name{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:700 19px var(--font-display)}
.tag{font:500 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
.check{
  flex:none;width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--muted);background:transparent;color:transparent;
  display:grid;place-items:center;
}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.meal-b{padding:4px 16px 14px}
.group{list-style:none;margin:0;padding:10px 0;border-top:1px dashed var(--line)}
.group:first-child{border-top:0}
.opt{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:3px}
.opt.noq{grid-template-columns:minmax(0,1fr)}
.qty{font:500 13px var(--font-mono);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.txt{overflow-wrap:anywhere}
.or{font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 0 2px 74px}
.note{margin:6px 0 0;font-size:14px;color:var(--muted)}
.idea{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.idea p{margin:0}
.idea .lbl,.lbl{margin:0 0 4px;font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.idea .or2{margin:6px 0;font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.recipe{margin-top:10px;border:1px solid var(--line);border-radius:10px;font-size:14.5px}
.recipe summary{padding:12px;min-height:44px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.recipe summary::-webkit-details-marker{display:none}
.recipe summary::after{content:"+";font:500 20px var(--font-mono);color:var(--accent)}
.recipe[open] summary::after{content:"−"}
.recipe .rb{padding:0 12px 12px}
.recipe h3{margin:10px 0 2px;font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.recipe p{margin:0;overflow-wrap:anywhere}

.visit{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 16px;border-radius:14px;background:var(--accent-soft)}
.visit .lbl{margin:0 0 2px;color:var(--accent)}
.visit .dt{margin:0;font:700 17px var(--font-display);overflow-wrap:anywhere}
.visit .in{flex:none;font:500 12px var(--font-mono);color:var(--accent-fg);background:var(--accent);padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}

/* peso */
.ff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ff .full{grid-column:1/-1}
.ff label{display:block}
.ff input{
  display:block;width:100%;min-width:0;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg);font:400 16px var(--font-body);-webkit-appearance:none;appearance:none;
}
.ff input::placeholder{color:var(--muted)}
.err{margin:10px 0 0!important;color:var(--fg);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.btn{display:block;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:600 16px var(--font-body)}
.sum{display:flex;gap:24px;margin-bottom:8px}
.sum p{margin:0}
.big{font:700 24px var(--font-display);font-variant-numeric:tabular-nums}
.chart{display:block;width:100%;height:auto;margin-top:4px}
.chart .ax{fill:var(--muted);font:10px var(--font-mono)}
.chart .gd{stroke:var(--line);stroke-width:1;fill:none}
.chart .ln{stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;fill:none}
.chart .dot{fill:var(--accent)}
.chart .dot.last{stroke:var(--surface);stroke-width:2}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.prow:first-of-type{border-top:0}
.prow .pd{overflow-wrap:anywhere}
.prow .pw{font:500 14px var(--font-mono);font-variant-numeric:tabular-nums}
.prow .pv{grid-column:1;font:400 13px var(--font-mono);color:var(--muted)}
.del{grid-column:3;grid-row:1/span 2;min-height:44px;min-width:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font:500 13px var(--font-body)}
.del.arm{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.prow .pw{grid-column:2;grid-row:1/span 2}

/* equivalenze, note, copia */
.swt{padding-bottom:2px}
.swb{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--accent);font:500 13px var(--font-body)}
.swb[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.swp{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.swp .sub+.sub{margin-top:14px}
.swp .lbl{color:var(--accent)}
.swp .note{margin:6px 0 0}
.tx{display:block;width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:400 16px/1.4 var(--font-body);resize:vertical;-webkit-appearance:none;appearance:none}
.tx::placeholder{color:var(--muted)}
.tx.mono{font:400 13px/1.45 var(--font-mono);margin-top:10px}
.ok{margin:10px 0 0!important;font-size:14px;color:var(--accent);font-weight:600}

/* sostituzioni */
.search{padding-top:12px}
.search input{
  width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg);font:400 16px var(--font-body);
  -webkit-appearance:none;appearance:none;
}
.search input::placeholder{color:var(--muted)}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;padding:14px 16px 14px}
.cat h2{margin:0 0 10px;font:700 18px var(--font-display)}
.base{padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.eqt{margin-top:12px}
.eq{list-style:none;margin:0;padding:0}
.eq li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:5px;border-top:1px dashed var(--line)}
.eq li:first-child{border-top:0}
.empty{margin:24px 0;text-align:center;color:var(--muted)}

/* consigli */
.lead{margin:16px 0 0;font:600 19px/1.3 var(--font-display);text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;padding:14px 16px}
.card h2{margin:0 0 6px;font:700 18px var(--font-display)}
.card ul{margin:0;padding:0;list-style:none}
.card li{position:relative;padding:6px 0 6px 16px}
.card li::before{content:"";position:absolute;left:0;top:.95em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.card p{margin:4px 0}
.card a{color:var(--accent);font-weight:600}

/* schede in basso */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:58px;padding:6px 0;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:500;
}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion: no-preference){
  .check,.day,.meal-h{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <div>
        <p class="eyebrow">Dieta di Diego</p>
        <h1 id="ttl"></h1>
      </div>
      <div class="chip" id="chip"></div>
    </div>
    <div class="days" id="days" role="group" aria-label="Giorni della settimana"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Sezioni">
  <div class="wrap">
    <button class="tab" type="button" data-v="piano">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Piano
    </button>
    <button class="tab" type="button" data-v="sost">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h13l-3-3M19 16H6l3 3"/></svg>
      Sostituzioni
    </button>
    <button class="tab" type="button" data-v="peso">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 18.5l5-6 4 3.5 8-10"/><path d="M3.5 21h17"/></svg>
      Peso
    </button>
    <button class="tab" type="button" data-v="cons">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.8" cy="7" r="1" fill="currentColor"/><circle cx="4.8" cy="12" r="1" fill="currentColor"/><circle cx="4.8" cy="17" r="1" fill="currentColor"/></svg>
      Consigli
    </button>
  </div>
</nav>

<script>
(function(){
"use strict";

var DN=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
var DL=["L","M","M","G","V","S","D"];
var MEALS=[["col","Colazione"],["spu","Spuntino"],["pra","Pranzo"],["mer","Merenda"],["cen","Cena"]];

/* ---------- dati del piano (dal PDF della Dott.ssa Della Corte) ---------- */
var TEA="Puoi aggiungere 1 tisana e/o 1 caffè senza zuccheri.";
var YK=[["120 g","yogurt bianco magro (1 vasetto, no marchio Muller)"],["150 g","kefir (da bere o in vasetto)"]];
var VERD=[["200 g","verdure o ortaggi misti, preferibilmente sia crudi che cotti"]];
var VERD150=[["150 g","verdure o ortaggi misti, preferibilmente sia crudi che cotti"]];
var OLIO10=[["10 g","olio extravergine di oliva (1 cucchiaio circa)"]];
var OLIO20=[["20 g","olio extravergine di oliva (2 cucchiai circa)"]];
var CHOC=["15 g","cioccolato fondente 85% min. cacao"];
var COCCO=["15 g","noce di cocco (in monoporzioni nei supermercati ben forniti)"];
var FSECCA=["15 g","frutta secca (mix o una sola tipologia)"];
var PATA=["30 g","patatine non fritte, per esempio Fiorentini (o San Carlo)"];
var BARR=["30 g","barretta Misura “protein”"];
var TRIA=["30 g","triangolini di cereali “Sì e No” Fiorentini (o altra marca)"];
var GALL=["30 g","gallette di riso ricoperte di cioccolato, Gullon o altra marca (1 monoporzione)"];
var SN1=[PATA,BARR,TRIA,GALL];
var SN2=[TRIA,BARR,GALL,PATA];
var PRIV=[["15 g","biscotti Privolat al miele Misura (2 biscotti)"],["20 g","biscotti Magretti"]];
var PAN_SPU=[["50 g","pane di grano duro (da alternare con pane integrale o panino soffiato)"],["50 g","panavena Misura, pane in cassetta (2 fette)"]];

var SATCOL={
  g:[
    [["150 g","latte Granarolo G+ senza lattosio (o altra marca)"]],
    [["30 g","farina di avena (o integrale o di riso)"]],
    [["50 g","albume d’uovo di gallina (puoi usare l’albume in brick)"]],
    [["50 g","yogurt bianco magro (3 cucchiai circa)"]],
    [["20 g","marmellata a ridotto tenore di zucchero (2 cucchiaini circa)"],["100 g","mirtillo nero (o lamponi o frutti rossi misti)"]]
  ],
  note:"Puoi aggiungere 1 caffè amaro. Se non prepari i pancake, puoi mangiare 2 pancake Milk Pro o Misura.",
  idea:["Pancake. Puoi triplicare la quantità degli ingredienti e preparare i pancake per 3 giorni consecutivi, conservandoli in frigo in appositi contenitori."],
  rec:{t:"Pancake",
    i:"Farina, albume, yogurt, ½ cucchiaino raso di bicarbonato, qualche goccia di limone (o lievito per dolci, quindi niente bicarbonato), 1 cucchiaio di bevanda vegetale o latte.",
    p:"Sbatti l’albume, unisci lo yogurt e amalgama. Aggiungi la farina e mescola fino a ottenere un composto uniforme e denso. Se è troppo denso, aggiungi la bevanda vegetale (o il latte). Aggiungi il bicarbonato e qualche goccia di limone, mescola. Cuoci per pochi minuti su entrambi i lati in una padella antiaderente ben calda. Aspetta che si formino delle bollicine sulla superficie prima di girarli. A cottura ultimata guarnisci."}
};

var PLAN=[
/* Lunedì */
{
 col:{g:[
   [["120 g","yogurt bianco magro (1 vasetto, no marchio Muller)"],["150 g","latte Granarolo G+ senza lattosio"]],
   [["40 g","muesli"],["40 g","cereali Misura “grani antichi”"],["40 g","cereali Misura “dolcesenza”"]],
   [CHOC]
  ],note:TEA,idea:["Yogurt o latte con cereali e scaglie di cioccolato."]},
 spu:{g:[SN1],idea:["Yogurt con banana a tocchetti, a cui puoi aggiungere cacao amaro e 1 cucchiaino di burro di frutta secca."]},
 pra:{g:[
   [["100 g","pane integrale (oppure panino)"]],
   [["100 g","tonno al naturale (o all’olio di oliva ben sgocciolato)"]],
   VERD,OLIO10
  ]},
 mer:{g:[YK,[["120 g","banana"],["120 g","uva"]],[CHOC,COCCO,FSECCA]]},
 cen:{g:[
   [["70 g","pane di segale (o integrale o ai multicereali)"]],
   [["150 g","petto di pollo (o macinato magro)"]],
   VERD,OLIO20
  ],idea:[
   "Polpettine di macinato magro amalgamate con albume d’uovo e cotte in friggitrice ad aria o al forno, con contorno di verdurine miste.",
   "Straccetti di petto di pollo (anche panati con pangrattato, crusca d’avena o farina) con zucchine in padella."
  ]}
},
/* Martedì */
{
 col:{g:[
   [["120 g","yogurt bianco magro (no marchio Muller)"],["150 g","latte Granarolo G+ senza lattosio (o altra marca)"]],
   [["40 g","biscotti “buoni senza” al grano saraceno Cereal (o altra tipologia linea Cereal)"],["40 g","biscotti al grano saraceno Galbusera (o altra tipologia linea Galbusera)"],["40 g","biscotti con cacao e riso soffiato Misura (o altra tipologia linea Misura)"]]
  ],note:TEA,
  idea:["Colazione al cucchiaio: stratifica in un bicchiere lo yogurt e i biscottini sbriciolati. Tieni in frigo anche tutta la notte. Aggiungi come topping la cremina al cacao."],
  rec:{t:"Cremina al cacao",
   i:"1 cucchiaio di cacao amaro in polvere, acqua o bevanda vegetale o latte vaccino q.b. (circa 3-4 cucchiai).",
   p:"Versa il cacao amaro in una tazza e aggiungi poca acqua per volta, a filo, mescolando continuamente per evitare i grumi."}},
 spu:{g:[PAN_SPU,[["50 g","prosciutto crudo di Parma senza grasso (o arrosto di tacchino o bresaola)"]]]},
 pra:{g:[
   [["80 g","pasta di semola integrale (da alternare con pasta non integrale)"],["80 g","tortellini secchi (con ripieno di carne o di ricotta)"]],
   [["15 g","parmigiano (1 monoporzione)"]],
   VERD,
   [["10 g","olio extravergine di oliva (1 cucchiaino circa)"]]

var CHECK=new Date(2026,10,4);
function checkHtml(){
  var t=new Date(T.d.getFullYear(),T.d.getMonth(),T.d.getDate());
  var diff=Math.round((CHECK-t)/86400000);
  if(diff<0){return "";}
  var when=diff===0?"oggi":(diff===1?"domani":"tra "+diff+" giorni");
  var s=CHECK.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  s=s.charAt(0).toUpperCase()+s.slice(1);
  return '<aside class="visit" aria-label="Prossimo controllo"><div><p class="lbl">Prossimo controllo</p><p class="dt">'+esc(s)+'</p></div><span class="in">'+when+'</span></aside>';
}

/* ---------- utilità ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
var mem={};
function get(k){try{var v=localStorage.getItem(k);if(v!==null){return v;}}catch(e){}return mem[k]||null;}
function put(k,v){
  if(v){mem[k]=v;}else{delete mem[k];}
  try{if(v){localStorage.setItem(k,v);}else{localStorage.removeItem(k);}}catch(e){}
}
function todayInfo(){var d=new Date();return {d:d,idx:(d.getDay()+6)%7};}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

function mealHtml(i,m){
  var d=PLAN[i][m[0]];
  var h='<article class="meal" data-m="'+m[0]+'"><div class="meal-h"><h2 class="meal-name">'+esc(m[1])+'<span class="tag" hidden>Prossimo</span></h2>'
    +'<button class="check" type="button" aria-pressed="false" aria-label="Segna come completato: '+esc(m[1])+'">'
    +'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div><div class="meal-b">';
  d.g.forEach(function(g){h+=groupHtml(g)+swHtml(m[0],g);});
  if(d.note){h+='<p class="note">'+esc(d.note)+'</p>';}
  if(d.idea){
    h+='<div class="idea"><p class="lbl">Idea di abbinamento</p>';
    d.idea.forEach(function(t,k){if(k){h+='<p class="or2">oppure</p>';}h+='<p>'+esc(t)+'</p>';});

  var list=mealsOf(sel),done=0,nextSet=false,isToday=(sel===T.idx);
  list.forEach(function(m){
    var el=main.querySelector('[data-m="'+m[0]+'"]');
    if(!el){return;}
    var on=get(key(sel,m[0]))==="1";
    if(on){done++;}
    el.classList.toggle("done",on);
    el.querySelector(".check").setAttribute("aria-pressed",on?"true":"false");
    var show=isToday&&!on&&!nextSet;
    if(show){nextSet=true;}
    el.querySelector(".tag").hidden=!show;
  });
  elChip.textContent=done+" su "+list.length+" pasti";
  elChip.classList.toggle("full",done===list.length);
}

/* ---------- vista Peso ---------- */
var PK="dieta:peso";
function loadP(){
  try{
    var a=JSON.parse(get(PK)||"[]");
    if(Array.isArray(a)){
      return a.filter(function(e){return e&&typeof e.d==="string"&&typeof e.w==="number";})
        .sort(function(x,y){return x.d<y.d?-1:(x.d>y.d?1:0);});
    }
  }catch(e){}
  return [];
}
function saveP(a){put(PK,a.length?JSON.stringify(a):"");}
function toNum(s){var n=parseFloat(String(s).trim().replace(",","."));return isNaN(n)?null:n;}
function r1(n){return Math.round(n*10)/10;}
function fmtN(n){return n.toLocaleString("it-IT",{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmtV(n){return n.toLocaleString("it-IT",{maximumFractionDigits:1});}
function toT(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getTime();}
function fmtD(s,long){
  return new Date(toT(s)).toLocaleDateString("it-IT",long?{weekday:"short",day:"numeric",month:"short"}:{day:"numeric",month:"short"});
}
function signed(n){var v=r1(n);return (v>0?"+":(v<0?"\u2212":""))+fmtN(Math.abs(v));}

function chartSvg(a){
  var W=320,H=150,L=44,R=14,Tp=14,B=26;
  var ws=a.map(function(e){return e.w;});
  var dmn=Math.min.apply(null,ws),dmx=Math.max.apply(null,ws);
  var mn=dmn,mx=dmx;
  if(mx-mn<1){mn-=0.5;mx+=0.5;}else{var p=(mx-mn)*0.15;mn-=p;mx+=p;}
  var t0=toT(a[0].d),span=(toT(a[a.length-1].d)-t0)||1;
  function X(e){return a.length===1?L+(W-L-R)/2:L+(toT(e.d)-t0)/span*(W-L-R);}
  function Y(w){return Tp+(mx-w)/(mx-mn)*(H-Tp-B);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del peso">';
  var ys=[dmx];if(dmn!==dmx){ys.push(dmn);}
  ys.forEach(function(v){
    s+='<line class="gd" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>'
      +'<text class="ax" x="'+(L-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+fmtN(v)+'</text>';
  });
  if(a.length>1){
    s+='<polyline class="ln" points="'+a.map(function(e){return X(e).toFixed(1)+","+Y(e.w).toFixed(1);}).join(" ")+'"/>';
  }
  a.forEach(function(e,i){
    s+='<circle class="dot'+(i===a.length-1?' last':'')+'" cx="'+X(e).toFixed(1)+'" cy="'+Y(e.w).toFixed(1)+'" r="'+(i===a.length-1?5:3.5)+'"/>';
  });
  if(a.length>1){
    s+='<text class="ax" x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+esc(fmtD(a[0].d))+'</text>'
      +'<text class="ax" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtD(a[a.length-1].d))+'</text>';
  }else{
    s+='<text class="ax" x="'+X(a[0]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(fmtD(a[0].d))+'</text>';
  }
  return s+'</svg>';
}

function renderPeso(){
  var a=loadP();
  var h=checkHtml();
  h+='<section class="card"><h2>Registra il peso</h2><form id="pf" novalidate>'
    +'<div class="ff"><div class="full"><label class="lbl" for="pd">Data</label><input id="pd" type="date" value="'+ymd(T.d)+'" max="'+ymd(T.d)+'"></div>'

    +'<div><label class="lbl" for="pv">Vita (cm)</label><input id="pv" type="text" inputmode="decimal" placeholder="facoltativa" autocomplete="off"></div></div>'
    +'<p class="err" id="pe" role="alert" hidden></p><button class="btn" type="submit">Salva</button></form>'
    +'<p class="note">I dati restano su questo telefono. Se cancelli i dati di Safari si perdono.</p></section>';
  if(a.length){
    var first=a[0],last=a[a.length-1];

    });
    h+='</section>';
  }else{
    h+='<p class="empty">Ancora nessuna misura. Inserisci il peso di oggi e qui compare l\u2019andamento fino al controllo.</p>';
  }
  h+='<section class="card"><h2>Copia i tuoi dati</h2><p>Mette in un testo il peso, le note e i pasti completati, da incollare in Note o da mandare alla nutrizionista.</p>'
    +'<button class="btn" type="button" id="cpb">Copia riepilogo</button><p class="ok" id="cps" role="status" hidden></p>'
    +'<textarea id="cpt" class="tx mono" readonly rows="8" hidden aria-label="Riepilogo"></textarea></section>';
  main.innerHTML=h;

function showErr(t){var e=document.getElementById("pe");e.textContent=t;e.hidden=false;}
main.addEventListener("submit",function(e){
  if(!e.target||e.target.id!=="pf"){return;}
  e.preventDefault();
  var d=document.getElementById("pd").value;
  var w=toNum(document.getElementById("pw").value);

main.addEventListener("click",function(e){

/* ---------- equivalenze nei pasti ---------- */
var RX={
  verd:/\b(verdure|ortaggi)\b/,
  olio:/\bolio extravergine\b/,
  leg:/\b(ceci|lenticchie|piselli|fagioli|fave)\b/,
  carne:/\b(pollo|tacchino|vitello|maiale|hamburger|macinato|bresaola|prosciutto|fesa)\b/,
  pesce:/\b(merluzzo|nasello|calamaro|seppia|spigola|orata|pesce spada|tonno|polpo)\b/,
  form:/\b(philadelphia|parmigiano|formaggio|ricotta|fiocchi di latte)\b/,
  cer:/\b(pane|pasta|riso|gnocchi|couscous|patate|tortellini|frisella|orzo|farro)\b/,
  fr:/\b(mela|pera|arance|banana|uva|mandarini|melone)\b/
};
function catsFor(mk,g){
  var t=norm(g.map(function(o){return o[1];}).join(" ")).replace(/\([^)]*\)/g," ");
  var out=[];
  if(mk==="pra"||mk==="cen"){
    if(RX.cer.test(t)){out.push(mk==="pra"?"Cereali a pranzo":"Cereali a cena");}
    if(RX.leg.test(t)){out.push("Legumi");}
    if(RX.carne.test(t)){out.push("Carne");}
    if(RX.pesce.test(t)){out.push("Pesce");}
    if(RX.form.test(t)){out.push("Formaggi");}
    if(RX.verd.test(t)){out.push("Verdure");}
    if(RX.olio.test(t)){out.push("Olio per condire");}
  }else if(mk==="spu"||mk==="mer"){
    if(RX.fr.test(t)){out.push("Frutta dello spuntino");}
  }
  return out;
}
function swHtml(mk,g){
  var c=catsFor(mk,g);
  if(!c.length){return "";}
  return '<div class="swt"><button class="swb" type="button" aria-expanded="false" data-c="'+esc(c.join("|"))+'">Equivalenze</button><div class="swp" hidden></div></div>';
}
function subInline(c){
  var h='<div class="sub"><p class="lbl">'+esc(c.c)+'</p><ul class="eq">';
  if(c.b){h+='<li><span class="qty">'+esc(c.b[0])+'</span><span class="txt">'+esc(c.b[1])+' (nel piano)</span></li>';}
  c.e.forEach(function(o){h+='<li><span class="qty">'+esc(o[0])+'</span><span class="txt">'+esc(o[1])+'</span></li>';});
  h+='</ul>';
  if(c.n){h+='<p class="note">'+esc(c.n)+'</p>';}
  return h+'</div>';
}
main.addEventListener("click",function(e){
  var b=e.target.closest(".swb");
  if(!b){return;}
  var p=b.nextElementSibling;
  var open=b.getAttribute("aria-expanded")==="true";
  if(open){b.setAttribute("aria-expanded","false");p.hidden=true;return;}
  if(!p.innerHTML){
    var names=b.getAttribute("data-c").split("|"),h="";
    names.forEach(function(n){SUBS.forEach(function(c){if(c.c===n){h+=subInline(c);}});});
    p.innerHTML=h;
  }
  b.setAttribute("aria-expanded","true");
  p.hidden=false;
});

/* ---------- copia riepilogo ---------- */
function allKeys(){
  var ks={};
  try{for(var i=0;i<localStorage.length;i++){ks[localStorage.key(i)]=1;}}catch(e){}
  Object.keys(mem).forEach(function(k){ks[k]=1;});
  return Object.keys(ks);
}
function longD(s){
  return new Date(toT(s)).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
}
function summaryText(){
  var L=[];
  L.push("Dieta di Diego, riepilogo al "+T.d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}));
  var t=new Date(T.d.getFullYear(),T.d.getMonth(),T.d.getDate());
  if(CHECK>=t){
    var cs=CHECK.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
    L.push("Prossimo controllo: "+cs);
  }
  var a=loadP();
  L.push("","PESO");
  if(a.length){a.forEach(function(e){L.push(longD(e.d)+": "+fmtN(e.w)+" kg"+(typeof e.v==="number"?", vita "+fmtV(e.v)+" cm":""));});}
  else{L.push("Nessuna misura registrata.");}
  var notes=[],done={};
  allKeys().forEach(function(k){
    var m=/^dieta:nota:(\d{4}-\d{2}-\d{2})$/.exec(k);
    if(m){var v=get(k);if(v&&v.trim()){notes.push([m[1],v.trim()]);}return;}
    m=/^dieta:(\d{4}-\d{2}-\d{2}):(col|spu|pra|mer|cen)$/.exec(k);
    if(m&&get(k)==="1"){done[m[1]]=(done[m[1]]||0)+1;}
  });
  notes.sort(function(x,y){return x[0]<y[0]?-1:1;});
  L.push("","NOTE");
  if(notes.length){notes.forEach(function(n){L.push(longD(n[0])+": "+n[1].replace(/\s*\n\s*/g," / "));});}
  else{L.push("Nessuna nota.");}
  var days=Object.keys(done).sort();
  L.push("","PASTI COMPLETATI");
  if(days.length){
    days.forEach(function(d){
      var idx=(new Date(toT(d)).getDay()+6)%7;
      L.push(longD(d)+": "+done[d]+" su "+mealsOf(idx).length);
    });
  }else{L.push("Nessun pasto segnato.");}
  return L.join("\n");
}
main.addEventListener("click",function(e){
  var b=e.target.closest("#cpb");
  if(!b){return;}
  var txt=summaryText();
  var ta=document.getElementById("cpt"),st=document.getElementById("cps");
  ta.value=txt;ta.hidden=false;
  function fallback(){
    st.textContent="Tocca il testo qui sotto, scegli Seleziona tutto e poi Copia.";
    st.hidden=false;
    try{ta.focus();ta.select();}catch(x){}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        st.textContent="Copiato. Incollalo dove vuoi.";st.hidden=false;
      },fallback);
    }else{fallback();}
  }catch(x){fallback();}
});
