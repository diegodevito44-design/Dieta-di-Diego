<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dieta di Diego</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1819" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app a una colonna per iPhone X. Barra del giorno fissa in alto, schede dei pasti al centro, tre schede in basso.
   Le quantità stanno in una colonna a parte, in monospazio, come la posologia su una ricetta. */
:root{
  --bg:#EEF3F1;
  --surface:#FFFFFF;
  --surface-2:#E5EDEA;
  --fg:#10252A;
  --muted:#586E73;
  --line:#D3DEDB;
  --accent:#0C6A60;
  --accent-fg:#FFFFFF;
  --accent-soft:#D4EDE8;
  --font-display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-body:"Figtree","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1819;
    --surface:#132427;
    --surface-2:#1B3134;
    --fg:#E3EEEC;
    --muted:#8FA7AB;
    --line:#25393C;
    --accent:#5CCDBE;
    --accent-fg:#06211E;
    --accent-soft:#17403E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1819;
  --surface:#132427;
  --surface-2:#1B3134;
  --fg:#E3EEEC;
  --muted:#8FA7AB;
  --line:#25393C;
  --accent:#5CCDBE;
  --accent-fg:#06211E;
  --accent-soft:#17403E;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:0 104px;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{
  max-width:560px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra superiore */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.eyebrow{margin:0;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 30px/1.1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h1 .d{display:block;font:500 14px var(--font-body);letter-spacing:0;color:var(--muted);margin-top:2px}
.chip{flex:none;font:500 12px var(--font-mono);padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:4px}
.chip.full{background:var(--accent);color:var(--accent-fg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding-block:12px}
.day{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-height:56px;padding:4px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);
}
.day .l{font:500 11px var(--font-mono);text-transform:uppercase;color:var(--muted)}
.day .n{font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.day::after{content:"";width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.day.today::after{background:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day[aria-pressed="true"] .l{color:inherit;opacity:.85}
.day[aria-pressed="true"].today::after{background:var(--accent-fg)}

main{padding-block:4px 0}

/* scheda pasto */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.meal.done .meal-h{background:var(--accent-soft)}
.meal-name{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:700 19px var(--font-display)}
.tag{font:500 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
.check{
  flex:none;width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--muted);background:transparent;color:transparent;
  display:grid;place-items:center;
}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.meal-b{padding:4px 16px 14px}
.group{list-style:none;margin:0;padding:10px 0;border-top:1px dashed var(--line)}
.group:first-child{border-top:0}
.opt{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:3px}
.opt.noq{grid-template-columns:minmax(0,1fr)}
.qty{font:500 13px var(--font-mono);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.txt{overflow-wrap:anywhere}
.or{font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 0 2px 74px}
.note{margin:6px 0 0;font-size:14px;color:var(--muted)}
.idea{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.idea p{margin:0}
.idea .lbl,.lbl{margin:0 0 4px;font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.idea .or2{margin:6px 0;font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.recipe{margin-top:10px;border:1px solid var(--line);border-radius:10px;font-size:14.5px}
.recipe summary{padding:12px;min-height:44px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.recipe summary::-webkit-details-marker{display:none}
.recipe summary::after{content:"+";font:500 20px var(--font-mono);color:var(--accent)}
.recipe[open] summary::after{content:"−"}
.recipe .rb{padding:0 12px 12px}
.recipe h3{margin:10px 0 2px;font:500 10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.recipe p{margin:0;overflow-wrap:anywhere}

/* sostituzioni */
.search{padding-top:12px}
.search input{
  width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg);font:400 16px var(--font-body);
  -webkit-appearance:none;appearance:none;
}
.search input::placeholder{color:var(--muted)}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;padding:14px 16px 14px}
.cat h2{margin:0 0 10px;font:700 18px var(--font-display)}
.base{padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.eqt{margin-top:12px}
.eq{list-style:none;margin:0;padding:0}
.eq li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:5px;border-top:1px dashed var(--line)}
.eq li:first-child{border-top:0}
.empty{margin:24px 0;text-align:center;color:var(--muted)}

/* consigli */
.lead{margin:16px 0 0;font:600 19px/1.3 var(--font-display);text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px;padding:14px 16px}
.card h2{margin:0 0 6px;font:700 18px var(--font-display)}
.card ul{margin:0;padding:0;list-style:none}
.card li{position:relative;padding:6px 0 6px 16px}
.card li::before{content:"";position:absolute;left:0;top:.95em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.card p{margin:4px 0}
.card a{color:var(--accent);font-weight:600}

/* schede in basso */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:58px;padding:6px 0;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:500;
}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion: no-preference){
  .check,.day,.meal-h{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <div>
        <p class="eyebrow">Dieta di Diego</p>
        <h1 id="ttl"></h1>
      </div>
      <div class="chip" id="chip"></div>
    </div>
    <div class="days" id="days" role="group" aria-label="Giorni della settimana"></div>

</header>

<main class="wrap" id="main"></main>

  </div>
</nav>

/* ---------- utilità ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
var mem={};
function get(k){try{var v=localStorage.getItem(k);if(v!==null){return v;}}catch(e){}return mem[k]||null;}
function put(k,v){
  if(v){mem[k]=v;}else{delete mem[k];}
  try{if(v){localStorage.setItem(k,v);}else{localStorage.removeItem(k);}}catch(e){}
}
function todayInfo(){var d=new Date();return {d:d,idx:(d.getDay()+6)%7};}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

var sel=T.idx;

var elTtl=document.getElementById("ttl");
var elChip=document.getElementById("chip");
var elDays=document.getElementById("days");

function dateOf(i){return new Date(T.d.getFullYear(),T.d.getMonth(),T.d.getDate()-T.idx+i);}
function key(i,m){return "dieta:"+ymd(dateOf(i))+":"+m;}
function mealsOf(i){return MEALS.filter(function(m){return PLAN[i][m[0]];});}
function fmt(d){return d.toLocaleDateString("it-IT",{day:"numeric",month:"long"});}

/* ---------- vista Piano ---------- */
function optHtml(o){
  return '<li class="opt'+(o[0]?'':' noq')+'">'+(o[0]?'<span class="qty">'+esc(o[0])+'</span>':'')+'<span class="txt">'+esc(o[1])+'</span></li>';
}
function groupHtml(g){
  var h="";
  g.forEach(function(o,i){if(i){h+='<li class="or">oppure</li>';}h+=optHtml(o);});
  return '<ul class="group">'+h+'</ul>';
}
function mealHtml(i,m){
  var d=PLAN[i][m[0]];
  var h='<article class="meal" data-m="'+m[0]+'"><div class="meal-h"><h2 class="meal-name">'+esc(m[1])+'<span class="tag" hidden>Prossimo</span></h2>'
    +'<button class="check" type="button" aria-pressed="false" aria-label="Segna come completato: '+esc(m[1])+'">'
    +'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div><div class="meal-b">';
  d.g.forEach(function(g){h+=groupHtml(g);});
  if(d.note){h+='<p class="note">'+esc(d.note)+'</p>';}
  if(d.idea){
    h+='<div class="idea"><p class="lbl">Idea di abbinamento</p>';
    d.idea.forEach(function(t,k){if(k){h+='<p class="or2">oppure</p>';}h+='<p>'+esc(t)+'</p>';});
    h+='</div>';
  }
  if(d.rec){
    h+='<details class="recipe"><summary>Ricetta: '+esc(d.rec.t)+'</summary><div class="rb"><h3>Ingredienti</h3><p>'+esc(d.rec.i)+'</p><h3>Preparazione</h3><p>'+esc(d.rec.p)+'</p></div></details>';
  }
  return h+'</div></article>';
}
function renderPiano(){
  var h="";
  mealsOf(sel).forEach(function(m){h+=mealHtml(sel,m);});
  main.innerHTML=h;
  refreshStatus();
}
function refreshStatus(){
  if(view!=="piano"){return;}
  var list=mealsOf(sel),done=0,nextSet=false,isToday=(sel===T.idx);
  list.forEach(function(m){
    var el=main.querySelector('[data-m="'+m[0]+'"]');
    if(!el){return;}
    var on=get(key(sel,m[0]))==="1";
    if(on){done++;}
    el.classList.toggle("done",on);
    el.querySelector(".check").setAttribute("aria-pressed",on?"true":"false");
    var show=isToday&&!on&&!nextSet;
    if(show){nextSet=true;}
    el.querySelector(".tag").hidden=!show;
  });
  elChip.textContent=done+" su "+list.length+" pasti";
  elChip.classList.toggle("full",done===list.length);
}

    h+='</ul>';
  }
  if(c.n){h+='<p class="note">'+esc(c.n)+'</p>';}

function drawSubs(v){
  var n=norm(v.trim()),out="";
  SUBS.forEach(function(c){
    var txt=norm(c.c+" "+(c.b?c.b[1]:"")+" "+c.e.map(function(o){return o[1];}).join(" ")+" "+(c.n||""));
    if(n&&txt.indexOf(n)<0){return;}
    out+=catHtml(c);
  });
  document.getElementById("subs").innerHTML=out||'<p class="empty">Nessun risultato per “'+esc(v.trim())+'”. Prova con un altro alimento.</p>';
}

        +'<span class="l">'+DL[i]+'</span><span class="n">'+dateOf(i).getDate()+'</span></button>';

  }else{

  if(ymd(n.d)!==ymd(T.d)){
    var wasToday=(sel===T.idx);
    T=n;
    if(wasToday){sel=T.idx;}
    render();
  }
});

render();
